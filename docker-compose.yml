version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: padaria_postgres
    environment:
      POSTGRES_USER: padaria_user
      POSTGRES_PASSWORD: padaria123
      POSTGRES_DB: padaria_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - padaria_network
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"

  backend-produtos:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: padaria_backend_produtos
    environment:
      PORT: 3001
      SERVICE_NAME: produtos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: padaria_user
      DB_PASSWORD: padaria123
      DB_NAME: padaria_db
      JWT_SECRET: padaria_secret_dev
      NODE_ENV: development
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    networks:
      - padaria_network
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    command: sh -c "SERVICE_NAME=produtos npm run dev"

  backend-pedidos:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: padaria_backend_pedidos
    environment:
      PORT: 3002
      SERVICE_NAME: pedidos
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: padaria_user
      DB_PASSWORD: padaria123
      DB_NAME: padaria_db
      JWT_SECRET: padaria_secret_dev
      NODE_ENV: development
    ports:
      - "3002:3002"
    depends_on:
      - postgres
    networks:
      - padaria_network
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    command: sh -c "SERVICE_NAME=pedidos npm run dev"

  backend-funcionarios:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: padaria_backend_funcionarios
    environment:
      PORT: 3003
      SERVICE_NAME: funcionarios
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: padaria_user
      DB_PASSWORD: padaria123
      DB_NAME: padaria_db
      JWT_SECRET: padaria_secret_dev
      NODE_ENV: development
    ports:
      - "3003:3003"
    depends_on:
      - postgres
    networks:
      - padaria_network
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    command: sh -c "SERVICE_NAME=funcionarios npm run dev"

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: padaria_frontend
    environment:
      REACT_APP_API_PRODUTOS: http://localhost:3001/api
      REACT_APP_API_PEDIDOS: http://localhost:3002/api
      REACT_APP_API_FUNCIONARIOS: http://localhost:3003/api
      WDS_SOCKET_PORT: 0
      CHOKIDAR_USEPOLLING: true
    ports:
      - "3000:3000"
    depends_on:
      - backend-produtos
      - backend-pedidos
      - backend-funcionarios
    networks:
      - padaria_network
    restart: unless-stopped
    extra_hosts:
      - "localhost:host-gateway"
    stdin_open: true
    tty: true

volumes:
  postgres_data:
    name: padaria_postgres_data

networks:
  padaria_network:
    name: padaria_network
    driver: bridge
    